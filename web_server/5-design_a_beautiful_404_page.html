<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Ceci n'est pas une page</title>
<style>
  :root {
    --sky: #8fb4c9;
    --sky-deep: #5d8aa6;
    --paper: #f7f3e8;
    --ink: #2b2a33;
    --shadow: rgba(30, 40, 55, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root { --sky: #2c4457; --sky-deep: #1b2c3a; --paper: #e9e3d3; --ink: #1d1c24; --shadow: rgba(0, 0, 0, .5); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(var(--sky), var(--sky-deep));
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  main { text-align: center; max-width: 34rem; }
  .sheet {
    position: relative;
    width: min(220px, 56vw);
    aspect-ratio: 3 / 4;
    margin: 0 auto 2.2rem;
    background: var(--paper);
    box-shadow: 0 18px 28px var(--shadow);
    clip-path: polygon(0 0, 78% 0, 100% 18%, 100% 100%, 0 100%);
    transform: rotate(-4deg);
    transition: transform .6s ease;
    animation: drift 1.4s ease-out both;
  }
  .sheet::after {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 22%; height: 18%;
    background: linear-gradient(225deg, transparent 50%, #d9d2bd 50%);
  }
  .sheet:hover { transform: rotate(3deg) translateY(-6px); }
  .sheet span {
    position: absolute;
    inset: 38% 12% auto;
    font-size: 3.4rem;
    letter-spacing: .08em;
    color: var(--ink);
    opacity: .85;
  }
  h1 {
    margin: 0 0 .6rem;
    font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
    font-weight: 400;
    font-size: clamp(2rem, 7vw, 3rem);
    line-height: 1.2;
    color: var(--paper);
    text-shadow: 0 2px 6px var(--shadow);
  }
  p { margin: 0 0 1.4rem; color: var(--paper); line-height: 1.6; }
  a {
    display: inline-block;
    padding: .7rem 1.4rem;
    background: var(--paper);
    color: var(--ink);
    text-decoration: none;
    border-radius: 2px;
  }
  a:hover { background: #fff; }
  a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @keyframes drift {
    from { transform: rotate(-14deg) translateY(-40px); opacity: 0; }
    to { transform: rotate(-4deg) translateY(0); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none; transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="sheet" role="img" aria-label="A blank sheet of paper"><span>404</span></div>
  <h1>Ceci n'est pas une page</h1>
  <p>The address you asked for doesn't exist on this server. It may have moved, or it may never have been written.</p>
  <a href="/">Back to the home page</a>
</main>
</body>
</html>
